name: Bug report
description: Something in the Revition CLI does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security problems here. Use private vulnerability reporting (the Security tab) or
        security@revition.com, as SECURITY.md describes.
  - type: input
    id: version
    attributes:
      label: CLI version
      description: The output of `revition --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: For example macOS 15.2, Ubuntu 24.04 or Windows 11.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: revition doctor --json
      description: Paste the output. Remove tokens, session credentials, email addresses and workspace names first.
      render: json
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
