# REVITION-CLI-PLAN T2.5.1 (AC1 "every step is green on 3 OS", AC3 "the evidence is recorded"; UA09 "Windows / Linux by
# the matrix", auditor ruling #517): the SAME Phase 2 journey (e2e/phase2.e2e.ts) against staging on Linux, then Windows.
# macOS is the person's own run. Manual dispatch only. The journey token is a repo secret the user minted for this run
# (cli:read, cli:write, cli:submit, 1 day); the Linux run keeps it (REVITION_E2E_KEEP_TOKEN=1) so Windows can run, and
# the Windows run revokes it (the journey's own AC3 step). Each OS submits its own version (above every earlier one).
# Paid: each run makes one metered sandbox run and one eval capped by eval_cap_credits (quoted first by the journey).
name: Phase 2 journey (Linux + Windows)

on:
  workflow_dispatch:
    inputs:
      app:
        description: The test developer's test app id (apps have no delete route).
        required: true
        type: string
      linux_version:
        description: The version the Linux run submits (x.y.z, above every earlier submission of the app).
        required: true
        type: string
      windows_version:
        description: The version the Windows run submits (above linux_version).
        required: true
        type: string
      eval_cap_credits:
        description: The eval fires only when its fresh quote is within this many credits.
        required: true
        default: '40'
        type: string

permissions:
  contents: read

jobs:
  linux:
    name: Phase 2 journey (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Phase 2 journey against staging
        shell: bash
        env:
          REVITION_E2E_HOST: api.revition.com
          REVITION_E2E_TOKEN: ${{ secrets.REVITION_E2E_PHASE2_TOKEN }}
          REVITION_E2E_APP: ${{ inputs.app }}
          REVITION_E2E_VERSION: ${{ inputs.linux_version }}
          REVITION_E2E_PAID_OK: '1'
          REVITION_E2E_EVAL_CAP_CREDITS: ${{ inputs.eval_cap_credits }}
          REVITION_E2E_KEEP_TOKEN: '1'
          REVITION_NO_UPDATE_CHECK: '1'
          DO_NOT_TRACK: '1'
        run: |
          mkdir -p phase2-out
          node --import tsx --test --test-timeout=300000 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=phase2-out/phase2-linux.junit.xml \
            e2e/phase2.e2e.ts 2>&1 | tee phase2-out/phase2-linux.log
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase2-linux
          path: phase2-out

  windows:
    name: Phase 2 journey (windows-latest)
    needs: linux
    # After Linux, whatever its result: the token is shared, and only this last run revokes it.
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Phase 2 journey against staging
        shell: bash
        env:
          REVITION_E2E_HOST: api.revition.com
          REVITION_E2E_TOKEN: ${{ secrets.REVITION_E2E_PHASE2_TOKEN }}
          REVITION_E2E_APP: ${{ inputs.app }}
          REVITION_E2E_VERSION: ${{ inputs.windows_version }}
          REVITION_E2E_PAID_OK: '1'
          REVITION_E2E_EVAL_CAP_CREDITS: ${{ inputs.eval_cap_credits }}
          REVITION_NO_UPDATE_CHECK: '1'
          DO_NOT_TRACK: '1'
        run: |
          mkdir -p phase2-out
          node --import tsx --test --test-timeout=300000 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=phase2-out/phase2-windows.junit.xml \
            e2e/phase2.e2e.ts 2>&1 | tee phase2-out/phase2-windows.log
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase2-windows
          path: phase2-out
